services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tax_intelligence
      POSTGRES_USER: tax_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_app -d tax_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tax-intelligence}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-this-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tax-intelligence}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-this-password}
      S3_BUCKET: ${S3_BUCKET:-tax-intelligence-documents}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing "local/$S3_BUCKET" &&
      mc anonymous set none "local/$S3_BUCKET"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine-regular:
    profiles: ["fiscal-engines"]
    build:
      context: .
      dockerfile: deploy/engines/regime-regular.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
      - "9101"
    ports:
      - "127.0.0.1:8080:8080"

  engine-simples:
    profiles: ["simples-nacional"]
    build:
      context: .
      dockerfile: deploy/engines/simples-nacional.Dockerfile
    restart: unless-stopped
    environment:
      DB_DOWNLOAD_URL: ${SIMPLES_DB_DOWNLOAD_URL:-}
    expose:
      - "8082"
      - "9103"
    ports:
      - "127.0.0.1:8082:8082"

  engine-danfse:
    profiles: ["fiscal-engines"]
    build:
      context: .
      dockerfile: deploy/engines/danfse.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      XML_MAX_SIZE_BYTES: ${XML_MAX_SIZE_BYTES:-5242880}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://tax_app:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/tax_intelligence?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REGIME_REGULAR_ENGINE_URL: ${REGIME_REGULAR_ENGINE_URL:-http://engine-regular:8080}
      SIMPLES_NACIONAL_ENGINE_URL: ${SIMPLES_NACIONAL_ENGINE_URL:-http://engine-simples:8082}
      DANFSE_ENGINE_URL: ${DANFSE_ENGINE_URL:-http://engine-danfse:8080}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tax-intelligence-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tax-intelligence}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-password}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-none}
      XML_MAX_SIZE_BYTES: ${XML_MAX_SIZE_BYTES:-5242880}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-7mb}
      # Public development-only key. NEVER use this value in production.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    command: ["sh", "-c", "pnpm --filter @tax-intelligence/api db:migrate:deploy && pnpm --filter @tax-intelligence/api start"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
