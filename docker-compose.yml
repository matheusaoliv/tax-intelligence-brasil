services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tax_intelligence
      POSTGRES_USER: tax_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_app -d tax_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://tax_app:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/tax_intelligence?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REGIME_REGULAR_ENGINE_URL: ${REGIME_REGULAR_ENGINE_URL:-http://engine-regular:8080}
      SIMPLES_NACIONAL_ENGINE_URL: ${SIMPLES_NACIONAL_ENGINE_URL:-http://engine-simples:8082}
    command: ["sh", "-c", "pnpm --filter @tax-intelligence/api db:migrate:deploy && pnpm --filter @tax-intelligence/api start"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
