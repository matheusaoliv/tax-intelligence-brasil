name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @tax-intelligence/api db:validate

      - name: Generate Prisma client
        run: pnpm --filter @tax-intelligence/api db:generate

      - name: API typecheck
        run: pnpm --filter @tax-intelligence/api typecheck

      - name: API tests
        run: pnpm --filter @tax-intelligence/api test

      - name: Build workspace
        run: pnpm build
